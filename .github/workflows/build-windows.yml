name: Build Windows installer and portable app

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare release assets
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force release-assets -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

      - name: Build Windows installer
        run: npm run package:win

      - name: Save Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not found in release."
          }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item $installer.FullName "release-assets\Mail-System-$version-Setup.exe"

      - name: Build Windows portable app
        run: npm run package:win:portable

      - name: Save Windows portable app
        shell: pwsh
        run: |
          $portable = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $portable) {
            throw "Windows portable app was not found in release."
          }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item $portable.FullName "release-assets\Mail-System-$version-Portable.exe"

      - name: Publish Windows installer release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: mail-system-windows-${{ github.sha }}
        run: |
          $assets = Get-ChildItem -Path release-assets -Filter *.exe | ForEach-Object { $_.FullName }
          if ($assets.Count -lt 2) {
            throw "Expected both Windows installer and portable app assets."
          }
          gh release create "$env:RELEASE_TAG" `
            $assets `
            --title "Mail System Windows builds (${{ github.sha }})" `
            --notes "Windows installer and portable app built from commit ${{ github.sha }}." `
            --prerelease