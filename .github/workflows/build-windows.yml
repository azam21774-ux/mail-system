name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run package:win

      - name: Publish Windows installer release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: mail-system-windows-${{ github.sha }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            --title "Mail System Windows installer (${{ github.sha }})" `
            --notes "Windows installer built from commit ${{ github.sha }}." `
            --prerelease

          $installer = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not found in release."
          }

          gh release upload "$env:RELEASE_TAG" $installer.FullName --clobber