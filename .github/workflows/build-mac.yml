name: Build macOS installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS installer
        run: npm run package:mac

      - name: Publish macOS installer release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: mail-system-macos-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" release/*.dmg \
            --title "Mail System macOS installer (${{ github.sha }})" \
            --notes "macOS installer built from commit ${{ github.sha }}." \
            --prerelease